<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{DISPLAY_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="music.song">
<title>{{PAGE_TITLE}}</title>
<link rel="stylesheet" href="../../assets/css/site.css">
<script type="application/ld+json">
{{JSON_LD}}
</script>
</head>
<body data-song="{{SLUG}}" data-root="../..">
<main class="shell">
  <nav class="topnav">
    <a class="brand" href="../../">Music <span>Gallery</span></a>
    <div class="navlinks">
      <a id="jsonLink" class="button" target="_blank">Raw JSON</a>
      <a id="repoLink" class="button" target="_blank" rel="noreferrer">GitHub source</a>
    </div>
  </nav>

  <header class="song-hero">
    <div>
      <div id="eyebrow" class="eyebrow"></div>
      <h1 id="title">{{DISPLAY_TITLE}}</h1>
      <div id="subtitle" class="song-sub">{{COMPOSER}}</div>
      <div id="badges" class="badges"></div>
    </div>
    <div class="hero-actions"><a class="button" href="../../">← Library</a></div>
  </header>

  <section class="card controls">
    <button id="play" class="primary">▶ Play</button>
    <button id="pause">Ⅱ Pause</button>
    <button id="stop">■ Stop</button>
    <label class="range">Tempo <input id="tempo" type="range"><b id="tempoOut">—</b></label>
    <label class="range">Ring <input id="gate" type="range" min="35" max="105" value="86"><b id="gateOut">86%</b></label>
    <select id="instrument" aria-label="Instrument"></select>
    <button id="loop">↻ Loop</button>
    <button id="midi">⇩ MIDI</button>
  </section>

  <section class="version-switch" aria-label="Rendition view">
    <div class="version-tabs" role="tablist">
      <button id="practiceView" role="tab" aria-selected="true">Practice sections</button>
      <button id="fullView" role="tab" aria-selected="false">Full rendition</button>
    </div>
    <span id="viewDescription"></span>
  </section>

  <div id="sectionButtons" class="section-buttons"></div>

  <div class="statusline">
    <label id="salvageWrap" class="toggle-control"><input id="salvage" type="checkbox"> ★ Salvage notes only</label>
    <span id="status">Loading…</span>
    <div class="progress"><div id="progress"></div></div>
    <span id="counter">0 / 0</span>
  </div>

  <section id="tabs" class="card tab-wrap"></section>

  <div id="helpText" class="card help"></div>

  <details class="card metadata">
    <summary>Rich metadata & provenance</summary>
    <div id="metaGrid" class="meta-grid"></div>
    <p id="qualityNote" class="muted small"></p>
    <ul id="sourceList" class="source-list"></ul>
  </details>

  <footer class="footer">
    <span>Segmented practice arrangement + provenance-backed full rendition when available.</span>
    <span><a href="../../data/song.schema.json" target="_blank">JSON schema</a></span>
  </footer>
</main>
<script type="module" src="../../assets/js/song-page.js"></script>
</body>
</html>
