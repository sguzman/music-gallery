<!doctype html>
<meta charset="utf-8">
<title>Ensemble MIDI smoke</title>
<pre id="result" data-status="running">running</pre>
<script type="module">
import {buildEnsembleMidi} from "../assets/js/ensemble-midi.js";

const result=document.querySelector("#result");
const fail=message=>{result.dataset.status="fail";result.textContent=message;throw new Error(message);};
try{
  const song=await fetch("../data/songs/canon-in-d.json").then(r=>r.json());
  const parts=(song.parts||[]).filter(part=>part.sourceDerived);
  if(parts.length!==4)fail(`expected 4 source parts, got ${parts.length}`);
  const bytes=buildEnsembleMidi(parts,{
    bpm:song.playbackGroups?.ensemble?.tempoBpm||55,
    unitsPerQuarter:song.musical.unitsPerQuarter||1,
    instrumentFor:part=>part.defaultInstrument
  });
  const text=new TextDecoder("latin1").decode(bytes);
  const trackCount=(text.match(/MTrk/g)||[]).length;
  const format=(bytes[8]<<8)|bytes[9];
  const declaredTracks=(bytes[10]<<8)|bytes[11];
  const ppq=(bytes[12]<<8)|bytes[13];
  for(const name of ["Violin I","Violin II","Violin III","Violoncello"]){if(!text.includes(name))fail(`missing MIDI track name ${name}`);}
  if(format!==1)fail(`expected format 1, got ${format}`);
  if(trackCount!==5||declaredTracks!==5)fail(`expected 5 tracks, got physical=${trackCount} declared=${declaredTracks}`);
  if(ppq!==480)fail(`expected PPQ 480, got ${ppq}`);
  result.dataset.status="pass";
  result.dataset.format=String(format);
  result.dataset.tracks=String(trackCount);
  result.dataset.ppq=String(ppq);
  result.textContent=`pass · format ${format} · ${trackCount} tracks · PPQ ${ppq}`;
}catch(error){if(result.dataset.status!=="fail"){result.dataset.status="fail";result.textContent=String(error);}}
</script>
