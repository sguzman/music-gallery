name: Probe ScoreTail public score

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_scoretail.py"
      - ".github/workflows/probe-scoretail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe public score and frontend assets
        run: python3 scripts/probe_scoretail.py
      - name: Commit probe result
        shell: bash
        run: |
          git add tmp/scoretail-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(probe): capture ScoreTail public score internals"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
