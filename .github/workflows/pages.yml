name: Deploy Music Gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Timing semantics self-test
        run: node scripts/test-timing.mjs
      - name: Specimen source-alignment self-test
        run: node scripts/test-specimen-alignment.mjs
      - name: Full rendition self-test
        run: node scripts/test-full-version.mjs
      - name: Full interaction contract self-test
        run: node scripts/test-full-interaction.mjs
      - name: Symbolic importer self-test
        run: python3 scripts/test-symbolic-import.py
          python3 scripts/test-symbolic-midi-profile.py
          node scripts/test-kirby64-corpus.mjs
      - name: Licensed MIDI importer self-test
        run: python3 scripts/test-licensed-midi-import.py
      - name: Browser module syntax check
        run: node --check assets/js/song-page.js
      - name: Build catalog and song wrappers
        run: python3 scripts/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
