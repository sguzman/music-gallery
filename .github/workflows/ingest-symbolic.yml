name: Ingest approved symbolic scores

on:
  push:
    branches: [main]
    paths:
      - "data/intake/**"
      - "data/sources/**"
      - "scripts/import_symbolic_score.py"
      - "scripts/test-symbolic-import.py"
      - ".github/workflows/ingest-symbolic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: symbolic-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Importer self-test
        run: python3 scripts/test-symbolic-import.py
      - name: Normalize approved sources
        run: python3 scripts/import_symbolic_score.py --all
      - name: Commit normalized artifacts
        shell: bash
        run: |
          git add data/ingested
          if git diff --cached --quiet; then
            echo "No normalized artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(ingest): refresh approved symbolic score artifacts"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update; retrying ($attempt/3)."
            sleep 2
          done
          echo "Unable to push generated artifacts after 3 attempts." >&2
          exit 1
