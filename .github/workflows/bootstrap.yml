name: Bootstrap Music Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: music-gallery-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize source tree
        shell: bash
        run: |
          cat site.tgz.b64.part0 site.tgz.b64.part1 site.tgz.b64.part2 site.tgz.b64.part3 site.tgz.b64.part4 | base64 -d | tar -xzf -
          rm -f site.tgz.b64 site.tgz.b64.part* .github/workflows/bootstrap.yml
          python3 scripts/build.py

      - name: Commit readable site source back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Music Gallery site source [materialized]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
