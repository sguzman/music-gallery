name: Capture approved Shostakovich Waltz No. 2 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-shostakovich-waltz2.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Capture ScoreBase PDMX MXL
        shell: bash
        run: |
          set -euo pipefail
          url='https://scorebase.org/scores/2165/file/mxl?download=true'
          out='data/sources/shostakovich-waltz-no2-wind-quintet.mxl'
          mkdir -p data/sources
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "$out"
          python3 - <<'PY'
          from pathlib import Path
          import io, re, zipfile, xml.etree.ElementTree as ET
          p=Path("data/sources/shostakovich-waltz-no2-wind-quintet.mxl")
          b=p.read_bytes()
          print("bytes",len(b),"prefix",b[:4])
          if b[:2] != b"PK":
              raise SystemExit("download is not an MXL ZIP")
          with zipfile.ZipFile(io.BytesIO(b)) as zf:
              xmls=[n for n in zf.namelist() if n.lower().endswith((".xml",".musicxml")) and not n.startswith("META-INF/")]
              if not xmls:
                  raise SystemExit("MXL contains no score XML")
              raw=zf.read(xmls[0])
              root=ET.fromstring(raw)
              def ln(tag): return tag.rsplit("}",1)[-1]
              parts=[]
              for sp in root.iter():
                  if ln(sp.tag)=="score-part":
                      name=next((c.text.strip() for c in list(sp) if ln(c.tag)=="part-name" and c.text),sp.attrib.get("id","part"))
                      parts.append(name)
              measure_counts=[]
              for part in [x for x in list(root) if ln(x.tag)=="part"]:
                  measure_counts.append(sum(1 for x in list(part) if ln(x.tag)=="measure"))
              print("rootfile",xmls[0])
              print("parts",len(parts),parts)
              print("measure_counts",measure_counts)
              if len(parts) < 4:
                  raise SystemExit(f"unexpectedly small transcription: {len(parts)} parts")
              if max(measure_counts or [0]) < 100:
                  raise SystemExit(f"unexpectedly short transcription: {measure_counts}")
          PY
      - name: Commit source
        shell: bash
        run: |
          git add data/sources/shostakovich-waltz-no2-wind-quintet.mxl
          if git diff --cached --quiet; then
            echo "Source already captured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(source): capture Shostakovich Waltz No. 2 witness"
          git push
