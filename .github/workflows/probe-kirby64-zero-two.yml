name: Analyze Kirby 64 Zero-Two MIDI

on:
  push:
    branches: [main]
    paths:
      - "data/intake/kirby64-zero-two.json"
      - "scripts/analyze_symbolic_midi.py"
      - "scripts/test-symbolic-midi-profile.py"
      - ".github/workflows/probe-kirby64-zero-two.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: MIDI analyzer self-test
        run: python3 scripts/test-symbolic-midi-profile.py
      - name: Fetch approved witness transiently
        run: |
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'https://www.vgmusic.com/music/console/nintendo/n64/02mid.mid' \
            -o /tmp/kirby64-zero-two.mid
          printf '%s  %s\n' '0894aed12e7842a706ab8898b8d16ec8' '/tmp/kirby64-zero-two.mid' | md5sum -c -
      - name: Build structural profile
        run: |
          python3 scripts/analyze_symbolic_midi.py /tmp/kirby64-zero-two.mid \
            --output data/ingested/kirby64-zero-two.midi-analysis.json \
            --source-url 'https://www.vgmusic.com/music/console/nintendo/n64/02mid.mid' \
            --source-page 'https://www.vgmusic.com/file/0894aed12e7842a706ab8898b8d16ec8.html'
      - name: Commit structural profile
        run: |
          git add data/ingested/kirby64-zero-two.midi-analysis.json
          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(kirby64): refresh Zero-Two MIDI structural profile"
          git push
