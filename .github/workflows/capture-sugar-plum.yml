name: Capture approved Sugar Plum source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-sugar-plum.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve archive download and capture source
        run: |
          python3 - <<'PY'
          from urllib.request import build_opener, HTTPCookieProcessor, Request
          from urllib.parse import urljoin
          from http.cookiejar import CookieJar
          from pathlib import Path
          import re, time, zipfile, io, sys

          initial = "https://notes.tarakanov.net/download/?file=%2Fu%2Fnotes%2Fmxml_p_-chaikovskii%2Fpjotr-iljitsch-tschaikowski-tchaikovsky-dance-of-the-sugar-plum-fairy-qmdyxyesfpgn.mxl"
          jar = CookieJar()
          opener = build_opener(HTTPCookieProcessor(jar))
          headers = {"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"}

          def get(url):
              req=Request(url,headers=headers)
              with opener.open(req,timeout=30) as r:
                  return r.geturl(), r.headers, r.read()

          u,h,b=get(initial)
          txt=b.decode("utf-8","replace")
          print("initial",u,h.get("content-type"),len(b))
          links=re.findall(r'''href=["']([^"']*uid=[^"']+)["']''',txt,re.I)
          if not links:
              print(txt[:8000])
              raise SystemExit("temporary uid link not found")
          temp=urljoin(u,links[0].replace("&amp;","&"))
          print("temporary",temp)
          u2,h2,b2=get(temp)
          txt2=b2.decode("utf-8","replace")
          print("countdown",u2,h2.get("content-type"),len(b2))
          for line in txt2.splitlines():
              if any(k in line.lower() for k in ("uid","download","href","location","timeout","form","action",".mxl","ajax","fetch","window")):
                  print("HTML",line[:1000])

          filepath_match=re.search(r'''id=["']filepath["'][^>]*value=["']([^"']+\.mxl)["']''',txt2,re.I)
          if not filepath_match:
              filepath_match=re.search(r'''value=["']([^"']+\.mxl)["'][^>]*id=["']filepath["']''',txt2,re.I)
          if not filepath_match:
              raise SystemExit("archive countdown page did not expose filepath")
          direct=urljoin(u2,filepath_match.group(1))
          print("direct archive path",direct)

          # The direct file URL deliberately redirects back through the gate.
          # Discover the site's own countdown JS and reproduce its final request.
          script_srcs=re.findall(r'''<script[^>]+src=["']([^"']+)["']''',txt2,re.I)
          print("script srcs",script_srcs)
          discovered=[]
          for src in script_srcs:
              su=urljoin(u2,src.replace("&amp;","&"))
              try:
                  _,_,sb=get(su)
              except Exception as e:
                  print("script fetch failed",su,repr(e)); continue
              st=sb.decode("utf-8","replace")
              if any(k in st for k in ("download-seconds","filepath","download-text")):
                  print("DOWNLOAD SCRIPT",su)
                  for match in re.finditer(r'.{0,500}(?:download-seconds|filepath|download-text).{0,1200}',st,re.I|re.S):
                      snippet=match.group(0).replace("\n"," ")
                      print(snippet[:2500])
                  discovered.append((su,st))

          if not discovered:
              raise SystemExit("could not locate archive download JS")

          # Common implementation: POST filepath after countdown. Try the forms
          # indicated by the discovered script rather than scraping a protected file.
          payload=None
          file_path=filepath_match.group(1)
          from urllib.parse import urlencode
          candidates=[]
          for su,st in discovered:
              for m in re.finditer(r'''(?:url\s*:\s*|ajax\s*\(|fetch\s*\(|location(?:\.href)?\s*=)\s*["']([^"']+)["']''',st,re.I):
                  candidates.append(urljoin(su,m.group(1)))
          print("candidate endpoints",candidates)
          for endpoint in dict.fromkeys(candidates):
              try:
                  data=urlencode({"file":file_path,"filepath":file_path}).encode()
                  req=Request(endpoint,data=data,headers={**headers,"Content-Type":"application/x-www-form-urlencoded"})
                  with opener.open(req,timeout=30) as rr:
                      bf=rr.read(); uf=rr.geturl(); ctype=rr.headers.get("content-type")
                  print("endpoint",endpoint,"->",uf,ctype,len(bf),bf[:4])
                  if bf[:2]==b"PK":
                      payload=bf; break
              except Exception as e:
                  print("endpoint failed",endpoint,repr(e))
          if payload is None:
              raise SystemExit("site JS located, but MXL payload endpoint was not resolved")

          with zipfile.ZipFile(io.BytesIO(payload)) as zf:
              xmls=[n for n in zf.namelist() if n.lower().endswith((".xml",".musicxml")) and not n.startswith("META-INF/")]
              if not xmls:
                  raise SystemExit("MXL has no score XML")
              score=zf.read(xmls[0]).decode("utf-8","replace")
              parts=len(re.findall(r"<score-part\b",score))
              measures=max([score.count("<measure"),0])
              print("captured score XML",xmls[0],"score-parts",parts,"measure tags",measures)
              if parts < 10:
                  raise SystemExit(f"candidate is not orchestral enough: {parts} score parts")

          out=Path("data/sources/sugar-plum-fairy-orchestra.mxl")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(payload)
          print("wrote",out,len(payload))
          PY
      - name: Commit source
        run: |
          git add data/sources/sugar-plum-fairy-orchestra.mxl
          if git diff --cached --quiet; then
            echo "Source already captured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(source): capture Sugar Plum orchestral score"
          git push
