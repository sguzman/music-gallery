name: Player v2 CI

on:
  push:
    branches: [player-v2]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build generated song data and apply timing audits
        run: python3 scripts/build.py
      - name: Validate generated song data
        run: python3 scripts/validate.py
      - name: Parse player JavaScript
        run: node --check assets/js/song-page-v2.js
      - name: Initialize player against real song JSON
        run: node scripts/smoke-player.mjs
